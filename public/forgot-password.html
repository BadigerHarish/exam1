<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Exam Hall Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            color: #1a202c;
            margin-bottom: 25px;
            font-size: 1.8em;
        }
        .role-selection {
            margin-bottom: 25px;
        }
        .role-selection button {
            background: #e2e8f0;
            color: #2d3748;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 0 5px;
        }
        .role-selection button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05em;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .back-link {
            display: block;
            margin-top: 25px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Forgot Password</h1>
        <div class="role-selection">
            <button id="teacherBtn" class="active">Teacher</button>
            <button id="studentBtn">Student</button>
        </div>
        <div id="message" class="message" style="display: none;"></div>

        <form id="teacherForm">
            <div class="form-group">
                <label for="teacherId">Teacher ID</label>
                <input type="text" id="teacherId" name="teacherId" required>
            </div>
            <div class="form-group">
                <label for="teacherNewPassword">New Password</label>
                <input type="password" id="teacherNewPassword" name="teacherNewPassword" required>
            </div>
            <div class="form-group">
                <label for="teacherConfirmPassword">Confirm New Password</label>
                <input type="password" id="teacherConfirmPassword" name="teacherConfirmPassword" required>
            </div>
            <button type="submit">Reset Teacher Password</button>
        </form>

        <form id="studentForm" style="display: none;">
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" name="studentId" required>
            </div>
            <div class="form-group">
                <label for="studentNewPassword">New Password</label>
                <input type="password" id="studentNewPassword" name="studentNewPassword" required>
            </div>
            <div class="form-group">
                <label for="studentConfirmPassword">Confirm New Password</label>
                <input type="password" id="studentConfirmPassword" name="studentConfirmPassword" required>
            </div>
            <button type="submit">Reset Student Password</button>
        </form>

        <a href="/login" class="back-link">Back to Login</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const teacherBtn = document.getElementById('teacherBtn');
            const studentBtn = document.getElementById('studentBtn');
            const teacherForm = document.getElementById('teacherForm');
            const studentForm = document.getElementById('studentForm');
            const messageDiv = document.getElementById('message');

            const API_BASE_URL = 'http://127.0.0.1:5000';

            function showMessage(type, text) {
                messageDiv.className = `message ${type}`;
                messageDiv.textContent = text;
                messageDiv.style.display = 'block';
            }

            function hideMessage() {
                messageDiv.style.display = 'none';
                messageDiv.textContent = '';
            }

            teacherBtn.addEventListener('click', () => {
                teacherBtn.classList.add('active');
                studentBtn.classList.remove('active');
                teacherForm.style.display = 'block';
                studentForm.style.display = 'none';
                hideMessage();
                teacherForm.reset();
            });

            studentBtn.addEventListener('click', () => {
                studentBtn.classList.add('active');
                teacherBtn.classList.remove('active');
                studentForm.style.display = 'block';
                teacherForm.style.display = 'none';
                hideMessage();
                studentForm.reset();
            });

            teacherForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessage();

                const teacherId = document.getElementById('teacherId').value.trim();
                const newPassword = document.getElementById('teacherNewPassword').value;
                const confirmPassword = document.getElementById('teacherConfirmPassword').value;

                if (newPassword !== confirmPassword) {
                    showMessage('error', 'New password and confirm password do not match.');
                    return;
                }

                if (!teacherId || !newPassword) {
                    showMessage('error', 'Please fill in all required fields.');
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/teachers/reset-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ id: teacherId, new_password: newPassword })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showMessage('success', result.message || 'Teacher password reset successfully!');
                        teacherForm.reset();
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 2000);
                    } else {
                        showMessage('error', result.message || 'Failed to reset teacher password. Teacher ID might be incorrect.');
                    }
                } catch (error) {
                    console.error('Error resetting teacher password:', error);
                    showMessage('error', 'An error occurred. Please try again.');
                }
            });

            studentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessage();

                const studentId = document.getElementById('studentId').value.trim();
                const newPassword = document.getElementById('studentNewPassword').value;
                const confirmPassword = document.getElementById('studentConfirmPassword').value;

                if (newPassword !== confirmPassword) {
                    showMessage('error', 'New password and confirm password do not match.');
                    return;
                }

                if (!studentId || !newPassword) {
                    showMessage('error', 'Please fill in all required fields.');
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/students/reset-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ id: studentId, new_password: newPassword })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showMessage('success', result.message || 'Student password reset successfully!');
                        studentForm.reset();
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 2000);
                    } else {
                        showMessage('error', result.message || 'Failed to reset student password. Student ID might be incorrect.');
                    }
                } catch (error) {
                    console.error('Error resetting student password:', error);
                    showMessage('error', 'An error occurred. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
